<!doctype html><meta charset="utf-8"><title>LinkX synthetic live capture lab</title><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}#source{display:block;width:1280px;height:720px}#controls{position:fixed;top:0;left:0;z-index:2}#v{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none}</style><div id="controls"><button id="start">Start capture</button><button id="stop">Stop</button><pre id="out"></pre></div><canvas id="source" width="1280" height="720"></canvas><video id="v" autoplay muted playsinline></video><script>
const c=document.querySelector('#source'),x=c.getContext('2d'),_status=document.querySelector('#status'),v=document.querySelector('#v');let scenario='paused',tick=0,revision=0
function draw(){x.fillStyle='#f7f8fa';x.fillRect(0,0,1280,720);x.fillStyle='#17212b';x.font='28px Arial';x.fillText('Reading view · account settings',48,70);x.strokeStyle='#aab4bf';x.lineWidth=2;x.strokeRect(46,96,1188,570);x.fillStyle='#202832';x.font='24px Arial';x.fillText('Daily summary',76,145);x.font='20px Arial';x.fillText('Your saved items are ready to review.',76,190);x.font='24px Arial';x.fillText(`Unread messages: ${scenario.includes('digit')&&revision?15:14}`,76,255);if(scenario.includes('text'))x.fillText('New delivery estimate: Thursday.',76,320);if(scenario.startsWith('indicator')){x.fillStyle='#1868c7';x.beginPath();x.arc(1160+Math.cos(tick*.75)*14,145+Math.sin(tick*.75)*14,8,0,Math.PI*2);x.fill()}requestAnimationFrame(draw)}draw();setInterval(()=>{if(scenario.startsWith('indicator')){tick++;draw()}},80);window.setScenario=(v,r=0)=>{scenario=v;revision=r;draw()}
window.startCapture=async()=>{const s=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},audio:false});v.srcObject=s;await v.play();window.stream=s;const t=s.getVideoTracks()[0];document.querySelector('#controls').style.display='none';window.frameStats={count:0,last:null,deltas:[],metadata:[]};const cb=(now,meta)=>{const f=window.frameStats;f.count++;if(f.last!==null)f.deltas.push(now-f.last);f.last=now;f.metadata.push({now,mediaTime:meta.mediaTime,presentedFrames:meta.presentedFrames,expectedDisplayTime:meta.expectedDisplayTime});v.requestVideoFrameCallback(cb)};v.requestVideoFrameCallback(cb);return t.getSettings()}
document.querySelector('#start').onclick=()=>window.startCapture().catch(e=>document.querySelector('#out').textContent=`ERROR ${e.name}: ${e.message}`);document.querySelector('#stop').onclick=()=>window.stream?.getTracks().forEach(t=>t.stop())
window.captureAnalyzer={states:null,width:0,height:0,setup:async()=>{await new Promise(r=>v.requestVideoFrameCallback(()=>r()));const canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0);const px=ctx.getImageData(0,0,canvas.width,canvas.height).data;const a=window.captureAnalyzer;a.width=canvas.width;a.height=canvas.height;a.canvas=canvas;a.ctx=ctx;a.states=Object.fromEntries(['whole-frame','changed-tile'].map(policy=>[policy,{baseline:new Uint8ClampedArray(px),previous:null,stableSince:null,tileStableSince:[],accepted:0,frames:[],scanMs:[],encodeMs:[],jpegBytes:[]}]))},sample:async({scenario,revision,sampleNo})=>{await new Promise(r=>v.requestVideoFrameCallback(()=>r()));const a=window.captureAnalyzer,canvas=a.canvas,ctx=a.ctx,w=a.width,h=a.height,tile=32,columns=Math.ceil(w/tile),rows=Math.ceil(h/tile),tileN=columns*rows,now=performance.now();ctx.drawImage(v,0,0,w,h);const current=ctx.getImageData(0,0,w,h).data,output={};for(const policy of ['whole-frame','changed-tile']){const state=a.states[policy],started=performance.now(),changes=new Uint32Array(tileN),unstable=new Uint32Array(tileN);let wholeStable=state.previous!==null;for(let off=0;off<current.length;off+=4){const p=off/4,ti=Math.floor(p/w/tile)*columns+Math.floor((p%w)/tile);if(Math.max(Math.abs(current[off]-state.baseline[off]),Math.abs(current[off+1]-state.baseline[off+1]),Math.abs(current[off+2]-state.baseline[off+2]))>=24)changes[ti]++;if(state.previous!==null&&(current[off]!==state.previous[off]||current[off+1]!==state.previous[off+1]||current[off+2]!==state.previous[off+2]||current[off+3]!==state.previous[off+3])){wholeStable=false;unstable[ti]++}}const candidates=[];for(let i=0;i<tileN;i++){const col=i%columns,row=Math.floor(i/columns),area=Math.min(tile,w-col*tile)*Math.min(tile,h-row*tile),changed=changes[i]/area>=.08;if(changed)candidates.push(i);if(policy==='changed-tile'){if(changed&&state.previous!==null&&unstable[i]===0){if(state.tileStableSince[i]===undefined)state.tileStableSince[i]=now}else state.tileStableSince[i]=undefined}}const stableTiles=policy==='changed-tile'?candidates.filter(i=>state.tileStableSince[i]!==undefined&&now-state.tileStableSince[i]>=150):[];const anyCandidate=candidates.length>0;let accepted=false;if(policy==='whole-frame'){if(!anyCandidate)state.stableSince=null;else if(!wholeStable)state.stableSince=null;else{if(state.stableSince===null)state.stableSince=now;if(now-state.stableSince>=150)accepted=true}}else accepted=stableTiles.length>0;if(accepted){state.accepted++;state.baseline=new Uint8ClampedArray(current);state.stableSince=null;state.tileStableSince=[];const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));state.encodeMs.push(performance.now()-started);state.jpegBytes.push(blob.size);state.frames.push({scenario,revision,sampleNo,atMs:now,width:w,height:h,candidateTiles:candidates.length,settledTileIds:stableTiles.slice(0,10),jpegBytes:blob.size});if(!window.__savedSamples)window.__savedSamples=[];window.__savedSamples.push({scenario,revision,sampleNo,bytes:blob.size,data:Array.from(new Uint8Array(await blob.arrayBuffer()))})}const scan=performance.now()-started;state.scanMs.push(scan);state.previous=new Uint8ClampedArray(current);output[policy]={candidateTiles:candidates.length,stableTiles:stableTiles.length,wholeFrameStable:wholeStable,accepted,scanMs:scan}}return{atMs:now,videoTime:v.currentTime,width:w,height:h,results:output}},snapshot:()=>({settings:window.stream.getVideoTracks()[0].getSettings(),frameCount:window.frameStats.count,medianFrameDeltaMs:window.frameStats.deltas.slice().sort((a,b)=>a-b)[Math.floor(window.frameStats.deltas.length/2)]})}
</script>
