<!doctype html><meta charset="utf-8"><title>LinkX synthetic live capture lab</title><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}#source{display:block;width:1280px;height:720px}#controls{position:fixed;top:0;left:0;z-index:2}#v{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none}</style><div id="controls"><button id="start">Start capture</button><button id="stop">Stop</button><pre id="out"></pre></div><canvas id="source" width="1280" height="720"></canvas><video id="v" autoplay muted playsinline></video><script>
const c=document.querySelector('#source'),x=c.getContext('2d'),_status=document.querySelector('#status'),v=document.querySelector('#v');let scenario='paused',tick=0,revision=0

window.startCapture=async()=>{const s=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},audio:false});v.srcObject=s;await v.play();window.stream=s;const t=s.getVideoTracks()[0];document.querySelector('#controls').style.display='none';window.frameStats={count:0,last:null,deltas:[],metadata:[]};const cb=(now,meta)=>{const f=window.frameStats;f.count++;if(f.last!==null)f.deltas.push(now-f.last);f.last=now;f.metadata.push({now,mediaTime:meta.mediaTime,presentedFrames:meta.presentedFrames,expectedDisplayTime:meta.expectedDisplayTime});v.requestVideoFrameCallback(cb)};v.requestVideoFrameCallback(cb);return t.getSettings()}

window.captureAnalyzer={states:null,width:0,height:0,setup:async(policyNames)=>{await new Promise(r=>v.requestVideoFrameCallback(()=>r()));const canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0);const px=ctx.getImageData(0,0,canvas.width,canvas.height).data;const a=window.captureAnalyzer;a.width=canvas.width;a.height=canvas.height;a.canvas=canvas;a.ctx=ctx;a.states=Object.fromEntries(policyNames.map(policy=>[policy,{baseline:new Uint8ClampedArray(px),previous:null,acceptedPixels:null,stableSince:null,accepted:0,duplicateCandidates:0,frames:[],scanMs:[],acceptedScanMs:[],encodeMs:[],jpegBytes:[]}]))},sample:async({policyNames,globalLimit,tile,tileLimit,settle,scenario,revision,sampleNo})=>{await new Promise(r=>v.requestVideoFrameCallback(()=>r()));const a=window.captureAnalyzer,canvas=a.canvas,ctx=a.ctx,w=a.width,h=a.height;ctx.drawImage(v,0,0,w,h);const current=ctx.getImageData(0,0,w,h).data,now=performance.now(),out={};for(const policy of policyNames){const state=a.states[policy],start=performance.now(),columns=Math.ceil(w/tile),counts=new Uint32Array(columns*Math.ceil(h/tile));let changed=0;for(let off=0;off<current.length;off+=4){if(Math.max(Math.abs(current[off]-state.baseline[off]),Math.abs(current[off+1]-state.baseline[off+1]),Math.abs(current[off+2]-state.baseline[off+2]))<24)continue;changed++;const p=off/4;counts[Math.floor(p/w/tile)*columns+Math.floor((p%w)/tile)]++}let changedTiles=0;for(let i=0;i<counts.length;i++){const col=i%columns,row=Math.floor(i/columns),area=Math.min(tile,w-col*tile)*Math.min(tile,h-row*tile);if(counts[i]/area>=tileLimit)changedTiles++}const fraction=changed/(w*h),already=state.acceptedPixels!==null&&current.every((q,i)=>q===state.acceptedPixels[i]),threshold=(policy.startsWith('global')?fraction>=globalLimit:changedTiles>0)&&!already;if(already&&(fraction>0||changedTiles>0))state.duplicateCandidates++;const stable=state.previous!==null&&current.every((q,i)=>q===state.previous[i]);let accepted=false;if(!threshold)state.stableSince=null;else if(!stable)state.stableSince=null;else{if(state.stableSince===null)state.stableSince=now;if(now-state.stableSince>=settle){accepted=true;state.accepted++;state.stableSince=null;state.acceptedPixels=new Uint8ClampedArray(current);state.frames.push({scenario,revision,sampleNo,atMs:now,width:w,height:h,globalFraction:fraction,changedTiles});if(policy.endsWith('last-accepted'))state.baseline=new Uint8ClampedArray(current)}}const scan=performance.now()-start;state.previous=new Uint8ClampedArray(current);state.scanMs.push(scan);if(accepted){state.acceptedScanMs.push(scan);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));state.encodeMs.push(performance.now()-start-scan);state.jpegBytes.push(blob.size);if(!window.__savedJpeg){window.__savedJpeg=await blob.arrayBuffer();window.__savedJpegMeta={scenario,policy,sampleNo,width:w,height:h,bytes:blob.size}}}out[policy]={fraction,changedTiles,accepted,stable,scanMs:scan,already}}return {atMs:now,videoTime:v.currentTime,width:a.width,height:a.height,results:out}},snapshot:()=>({settings:window.stream.getVideoTracks()[0].getSettings(),frameStats:{count:window.frameStats.count,medianDeltaMs:window.frameStats.deltas.length?window.frameStats.deltas.slice().sort((a,b)=>a-b)[Math.floor(window.frameStats.deltas.length/2)]:null,minDeltaMs:window.frameStats.deltas.length?Math.min(...window.frameStats.deltas):null,maxDeltaMs:window.frameStats.deltas.length?Math.max(...window.frameStats.deltas):null},jpegMeta:window.__savedJpegMeta})}
